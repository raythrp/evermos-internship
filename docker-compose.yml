services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: evermos
      MYSQL_USER: evermos
      MYSQL_PASSWORD: evermos
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uevermos", "-pevermos"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_USER: evermos
      DB_PASSWORD: evermos
      DB_HOST: db:3306
      JWT_SECRET: change-me-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
